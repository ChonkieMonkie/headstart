# SPDX-License-Identifier: GPL-3.0-or-later
#
# cargo-deny configuration. CI runs `cargo deny check licenses` so that no Rust
# crate with a licence incompatible with GPL-3.0-or-later slips in.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own crate is GPL-3.0-or-later and never published to crates.io.
ignore = true
