[package]
name = "headstart"
version = "0.1.0"
description = "Headstart: a study companion that helps you get started, stay focused and keep going"
authors = ["Headstart contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ChonkieMonkie/headstart"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows quirk).
name = "headstart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size-focused release profile, see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
